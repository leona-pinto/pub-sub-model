<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Dashboard</title>
  <link rel="stylesheet" href="css/smartHome-style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Smart Home Dashboard</h1>
    </header>

    <div class="content-grid">
      <section class="card location-card">
        <h2>Car Location</h2>
        <div class="data-grid">
          <div class="data-item">
            <label>Latitude:</label>
            <span id="latitude" class="value">--</span>
          </div>
          <div class="data-item">
            <label>Longitude:</label>
            <span id="longitude" class="value">--</span>
          </div>
          <div class="data-item">
            <label>Distance:</label>
            <span id="distance" class="value"><strong id="distance-value">--</strong> km</span>
          </div>
        </div>
      </section>

      <!-- Temperature Card -->
      <section class="card temperature-card">
        <h2>Temperature & Humidity</h2>
        <div class="data-grid">
          <div class="data-item">
            <label>Current Temp:</label>
            <span id="temperature-value" class="value">-- °C</span>
          </div>
          <div class="data-item">
            <label>Humidity:</label>
            <span id="humidity-value" class="value">-- %</span>
          </div>
        </div>
      </section>

      <!-- HVAC Card -->
      <section class="card hvac-card">
        <h2>HVAC</h2>
        <div class="status-display" id="hvac-status">
          <div class="status-text" id="hvac-text">OFF</div>
        </div>

        <!-- Humidifier subsystem -->
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
          <h3 style="font-size: 14px; margin: 0 0 10px 0;">HUMIDIFIER</h3>
          <div class="status-display" id="humidifier-status">
            <div class="status-text" id="humidifier-text">OFF</div>
          </div>
        </div>
      </section>

      <!-- Smart TV Card -->
      <section class="card tv-card">
        <h2>Smart TV</h2>
        <div class="status-display" id="tv-status">
          <div class="status-text" id="tv-text">OFF</div>
        </div>
      </section>

      <!-- Barbecue Card -->
      <section class="card barbecue-card">
        <h2>Barbecue</h2>
        <div class="status-display" id="barbecue-status">
          <div class="status-text" id="barbecue-text">OFF</div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/smartHome-app.js"></script>
</body>
</html>
